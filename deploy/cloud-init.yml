#cloud-config
timezone: America/Toronto
# =============================================================================
# GENERIC LINODE CLOUD-INIT
# =============================================================================
# Reusable bootstrap for any Linode Ubuntu instance.
# Paste this into Linode's "User Data" field when creating an instance.
#
# What it does:
#   1. Updates system packages
#   2. Installs Docker, Nginx, UFW, Fail2ban
#   3. Creates a "deploy" user with sudo + docker access
#   4. Hardens SSH (disable password auth, disable root login)
#   5. Configures firewall (SSH, HTTP, HTTPS only)
#   6. Creates a swap file (essential for small instances)
#
# After boot, SSH in as: ssh deploy@<linode-ip>
# You'll need to add your SSH public key to the deploy user (see below).
# =============================================================================

# --- System updates ---
package_update: true
package_upgrade: true
package_reboot_if_required: true

# --- Install packages ---
packages:
  - docker.io
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - fail2ban
  - curl
  - git
  - unattended-upgrades
  - cron            # runs the nightly backup drop-in (/etc/cron.d/cogext-backup)
  - rclone          # offsite backups to Google Drive (scripts/backup.sh)

# --- Create deploy user ---
users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      # Replace with your actual public key:
      - ssh-ed25519 AAAA... your-key-here

# --- Files written before runcmd ---
write_files:
  # Nightly backup cron — 2am America/Toronto (matches the healthchecks.io
  # schedule). Runs as the deploy user so it picks up ~deploy/.config/rclone.
  # NOTE: this fires even before backup.sh + .env exist, so the first run(s)
  # will error harmlessly until you've deployed and configured .env + rclone.
  - path: /etc/cron.d/cogext-backup
    permissions: '0644'
    content: |
      # CogExt nightly backup — see DEPLOY.md → "Automated backups"
      0 2 * * * deploy /opt/cogext/scripts/backup.sh >> /var/log/cogext-backup.log 2>&1

# --- Run commands after package install ---
runcmd:
  # -- Enable Docker --
  - systemctl enable docker
  - systemctl start docker

  # -- Ensure cron is running (the nightly backup relies on /etc/cron.d) --
  - systemctl enable cron
  - systemctl start cron

  # -- SSH hardening --
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd

  # -- Install Docker Compose (manual — avoids stale package manager versions) --
  - mkdir -p /usr/local/lib/docker/cli-plugins
  - curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

  # -- Firewall --
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # -- Fail2ban --
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # -- Swap file (2GB — critical for small instances) --
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # Low swappiness — only swap under memory pressure
  - sysctl vm.swappiness=10
  - echo 'vm.swappiness=10' >> /etc/sysctl.conf

  # -- Automatic security updates --
  - systemctl enable unattended-upgrades
  - systemctl start unattended-upgrades

  # -- Create app directories --
  - mkdir -p /opt/cogext
  - chown deploy:deploy /opt/cogext
  # scripts/ is where CI's sync-scripts job scp's backup.sh + restore.sh; the
  # target dir must exist before the first sync.
  - mkdir -p /opt/cogext/scripts
  - chown deploy:deploy /opt/cogext/scripts
  - mkdir -p /opt/backups/cogext
  - chown deploy:deploy /opt/backups/cogext

  # -- Backup log file (deploy-owned) --
  # The nightly cron redirects into this file. /var/log is root-owned, so without
  # a pre-created deploy-owned file the redirect fails to open it BEFORE
  # backup.sh runs — a silent no-backup. Create it once here.
  - touch /var/log/cogext-backup.log
  - chown deploy:deploy /var/log/cogext-backup.log
