# =============================================================================
# CI PIPELINE — CogExt
# =============================================================================
#
# This workflow runs on every push and pull request. It catches bugs BEFORE
# they reach production by running these checks:
#
#   1. lint-and-typecheck — ESLint + TypeScript compiler (catches syntax,
#      type errors, and code quality issues)
#   2. test — Vitest unit + component tests (catches logic bugs)
#   2a. integration — Vitest integration tests against a real pgvector Postgres
#      service (catches schema/migration/DB-layer bugs)
#   2b. e2e — Playwright drives the running app in a real browser (catches
#      routing, middleware, and rendering breakage)
#   3. build — Next.js production build (catches import errors, build failures)
#   4. docker — Docker image build (catches Dockerfile / dependency issues)
#
# Each job runs independently in parallel. If ANY job fails, the overall
# check fails and the PR gets a red X. The deploy job waits on the test jobs
# (including integration + e2e), so a failing test blocks the production deploy.
#
# DEPLOY JOB: only runs on pushes to main (not PRs). Builds a Docker image
# and pushes it to GitHub Container Registry (ghcr.io). Your server pulls
# the latest image on deploy.
#
# SETUP:
#   Before the deploy job works, you need to configure these GitHub secrets:
#     (Settings → Secrets and variables → Actions → New repository secret)
#
#   No secrets are needed for CI jobs (lint, test, build) — they work out
#   of the box with zero configuration.
# =============================================================================

name: CI

# ---- Triggers ----
# push to main: runs full pipeline including deploy
# pull_request: runs CI checks only (no deploy)
#
# paths-ignore: if a push/PR touches ONLY these paths, the whole workflow is
# skipped (commit just lands — no build, no deploy); anything else runs normally.
# The identical list is repeated under each event on purpose: GitHub Actions
# filters are per-event and its parser doesn't support YAML anchors to share them.
#   - '**.md' matches markdown at any depth ('*.md' would be root-level only).
#   - download-*.sh run from your Mac (they pull backups TO local), so they never
#     touch the server or the image. backup.sh / restore.sh are deliberately NOT
#     ignored — they run on the server, so a change triggers the lightweight
#     sync-scripts job (below) that copies them to the host, no image build.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'LICENSE'
      - 'scripts/download-backups.sh'
      - 'scripts/download-minio-images.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'LICENSE'
      - 'scripts/download-backups.sh'
      - 'scripts/download-minio-images.sh'

# ---- Permissions ----
# The deploy job needs write access to push Docker images to GHCR.
# We grant it at the workflow level (applies to all jobs).
permissions:
  contents: read
  packages: write

# =============================================================================
# JOB 1: Lint + Type Check
# =============================================================================
# Fast — typically finishes in <30s. Catches:
#   - ESLint rule violations (unused variables, missing imports, etc.)
#   - TypeScript type errors (wrong argument types, missing properties, etc.)
#
# Why separate from tests?
#   These are static checks (no code execution). They're fast and catch
#   different bugs than tests do. Running them in parallel with tests
#   gives faster feedback.
jobs:
  # =============================================================================
  # JOB 0: Detect what changed (routes the rest of the pipeline)
  # =============================================================================
  # Classifies the push so the heavy jobs (build → docker → deploy) only run
  # when APP code changed, and the lightweight script sync only runs when the
  # server-side ops scripts changed. dorny/paths-filter needs no database and
  # runs in a few seconds.
  #
  # Fail-safe note: the `app` list is an allow-list of things that require an
  # image rebuild. If you add a NEW app-relevant path, add it here too — a path
  # that matches neither filter is treated as "no build, no sync".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'drizzle/**'
              - 'scripts/migrate.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'drizzle.config.ts'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            scripts:
              - 'scripts/backup.sh'
              - 'scripts/restore.sh'

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      # ---- Checkout ----
      # actions/checkout clones your repo into the runner's workspace.
      # Without this, the runner has an empty directory.
      - uses: actions/checkout@v5

      # ---- Node.js setup ----
      # Installs the specified Node version and configures npm's cache.
      # The cache key is based on package-lock.json — if the lockfile
      # hasn't changed, npm ci reuses cached modules (~10s vs ~30s).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      # ---- Install dependencies ----
      # `npm ci` is the CI-safe version of `npm install`:
      #   - Deletes existing node_modules (clean slate)
      #   - Installs exact versions from package-lock.json
      #   - Fails if lockfile is out of sync with package.json
      - run: npm ci

      # ---- Lint ----
      # next lint runs ESLint with the Next.js preset.
      # The `--max-warnings 0` flag treats warnings as errors in CI —
      # this prevents warning creep (warnings pile up and everyone ignores them).
      - name: Lint
        run: npx eslint . --max-warnings 0

      # ---- Type Check ----
      # `tsc --noEmit` runs the TypeScript compiler without producing output files.
      # It only checks for type errors. If anything is wrong (e.g., you passed a
      # string where a number was expected), this fails with a clear error.
      - name: Type Check
        run: npx tsc --noEmit

      # ---- Migration drift check ----
      # Guards against the silent foot-gun where someone edits src/db/schema.ts
      # but forgets to generate + commit the migration. `drizzle-kit generate`
      # compares the schema to the snapshots in drizzle/meta (no database
      # needed); if the schema changed without a committed migration, it writes
      # a new file and `git diff --exit-code` then fails the build.
      #
      # Note: a column RENAME makes drizzle-kit prompt interactively, which
      # would hang here — generate those locally and commit; this step only
      # verifies the result is committed.
      - name: Check for uncommitted migrations
        run: |
          npx drizzle-kit generate
          git diff --exit-code drizzle/ \
            || (echo "::error::Schema changed but no migration committed. Run 'npm run db:generate' and commit the drizzle/ changes." && exit 1)

  # =============================================================================
  # JOB 2: Unit + Component Tests
  # =============================================================================
  # Runs Vitest unit tests and React Testing Library component tests.
  # These don't need a database — all external dependencies are mocked.
  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Run unit tests (vitest run uses vitest.config.ts which excludes
      # integration tests automatically via the exclude pattern).
      - name: Run Tests
        run: npm run test:unit

  # =============================================================================
  # JOB 2a: Integration Tests (real Postgres + pgvector)
  # =============================================================================
  # Runs Vitest integration tests (*.integration.test.ts) against a REAL
  # database — a pgvector Postgres service container spun up just for this job.
  # setup.integration.ts applies all migrations before the suite; the tests then
  # exercise the actual connection, schema, and pgvector extension.
  #
  # Gated on app changes (same as build) so doc/script-only pushes skip it.
  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cogext
          POSTGRES_PASSWORD: cogext
          POSTGRES_DB: cogext_test
        ports:
          - 5432:5432
        # Hold each step until Postgres is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U cogext -d cogext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Run integration tests
        env:
          # localhost:5432 — the service container's mapped port on the runner.
          DATABASE_URL: postgres://cogext:cogext@localhost:5432/cogext_test
        run: npm run test:integration

  # =============================================================================
  # JOB 2b: E2E Tests (Playwright — real browser + running app)
  # =============================================================================
  # Boots the app (Playwright's webServer runs `npm run dev` on :3100) against a
  # real pgvector Postgres, launches headless Chromium, and drives the app like
  # a user. Catches breakage unit/integration tests can't — routing, middleware,
  # rendering.
  #
  # Dummy secrets are fine: `next dev` runs with NODE_ENV=development, so
  # config.ts skips its production secret-strength checks. STORAGE_PROVIDER=local
  # avoids needing a MinIO container. Migrations are applied explicitly first
  # (dev mode doesn't auto-migrate — only the prod entrypoint does).
  #
  # Gated on app changes (same as build).
  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cogext
          POSTGRES_PASSWORD: cogext
          POSTGRES_DB: cogext_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cogext -d cogext_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://cogext:cogext@localhost:5432/cogext_e2e
      # Dummy runtime secrets — dev mode doesn't enforce strength, and these
      # flows don't call the real AI providers.
      JWT_SECRET: e2e-not-a-real-secret
      CRON_SECRET: e2e-not-a-real-cron-secret
      VOYAGE_API_KEY: e2e-not-a-real-key
      ANTHROPIC_API_KEY: e2e-not-a-real-key
      STORAGE_PROVIDER: local

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Only Chromium — matches the single enabled project in playwright.config.ts.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Dev mode doesn't run migrations on boot, so seed the schema first.
      # Use drizzle-kit (reads out:"./drizzle" from drizzle.config.ts) — NOT
      # scripts/migrate.mjs, which is the prod-only runner that resolves its
      # migrations folder relative to itself (scripts/drizzle) and only works
      # inside the Docker standalone layout.
      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run E2E tests
        run: npm run test:e2e

      # Keep the report even on failure — it's how you debug a CI-only break.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =============================================================================
  # JOB 3: Production Build
  # =============================================================================
  # Verifies the Next.js production build succeeds. This catches:
  #   - Import errors that only surface during build (tree shaking)
  #   - Server/client component boundary violations
  #   - Missing environment variables at build time
  #
  # We provide minimal dummy env vars so the build doesn't fail on
  # missing secrets. These are NOT real values — they're just enough
  # for Next.js to compile. The real values are injected at runtime.
  build:
    name: Next.js Build
    needs: changes
    # Only build when app code changed. docker + deploy `need` this job, so a
    # skipped build cascades — they skip automatically on script-only pushes.
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Provide dummy env vars so the config module doesn't throw.
      # These are NOT used for real requests — just for compilation.
      # The actual secrets are injected at container runtime.
      - name: Build
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
          JWT_SECRET: "ci-build-only-not-a-real-secret-do-not-use"
          CRON_SECRET: "ci-build-only-not-a-real-cron-secret-do-not-use"
          VOYAGE_API_KEY: "ci-build-only-not-a-real-key"
          ANTHROPIC_API_KEY: "ci-build-only-not-a-real-key"
        run: npm run build

  # =============================================================================
  # JOB 4: Docker Image Build
  # =============================================================================
  # Builds the Docker image to verify the Dockerfile is valid and the
  # multi-stage build completes. This catches:
  #   - Dockerfile syntax errors
  #   - Missing files referenced in COPY instructions
  #   - npm ci failures in the container (OS-specific native modules)
  #
  # On pushes to main, it also PUSHES the image to GitHub Container
  # Registry (ghcr.io) so your server can pull it for deployment.
  docker:
    name: Docker Build
    needs: [lint-and-typecheck, test, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ---- Login to GHCR (only on push to main) ----
      # ghcr.io is GitHub's built-in container registry. Free for public repos.
      # The GITHUB_TOKEN is automatically provided by GitHub Actions — no
      # manual secret needed.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Build (and optionally push) ----
      # docker/build-push-action handles caching, tagging, and pushing.
      #
      # Tags:
      #   - ghcr.io/OWNER/cogext:latest — always points to newest build
      #   - ghcr.io/OWNER/cogext:sha-abc123 — pinned to specific commit
      #
      # The SHA tag lets you roll back to an exact commit if something breaks.
      # "latest" is what your docker-compose.prod.yml pulls by default.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only push on main branch (not on PRs)
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  # =============================================================================
  # JOB 5: Deploy to Linode (smoke-checked, self-rolling-back)
  # =============================================================================
  # After the Docker image is pushed to GHCR, SSH into the server, pull the new
  # image, bring it up, and then PROVE it's actually serving before declaring
  # success. Only runs on pushes to main (not PRs).
  #
  # Why the smoke check: `up -d` returns the moment the container is *created*,
  # not when the app is *healthy*. A bad migration, a missing env var, or a
  # crash-on-boot would previously sail through as a green deploy. Now we poll
  # /api/health/ready (200 = DB reachable; degraded MinIO still returns 200 so
  # we don't roll back for non-critical blips) until it's ready or we give up.
  #
  # Auto-rollback: before pulling we capture the currently-running image ID.
  # If the new image never becomes ready, we re-tag that previous image as
  # :latest and recreate the container — no registry round-trip needed because
  # the compose file has no pull_policy, so `up -d` reuses the local image.
  # The job then exits non-zero so the run goes red and you get notified.
  #
  # CAVEAT — database migrations are NOT rolled back. The entrypoint runs
  # migrations forward on boot; rolling the image back does not revert them.
  # For a deploy that fails *after* a forward migration applied, the rolled-back
  # (older) image may be running against a newer schema. That's usually fine for
  # additive migrations but can bite on destructive ones — treat a rollback as
  # "site is up on old code" and investigate, not "nothing happened."
  #
  # Required GitHub Secrets:
  #   DEPLOY_HOST    — server IP or hostname
  #   DEPLOY_SSH_KEY — private SSH key for the "deploy" user on the server
  deploy:
    name: Deploy
    needs: [lint-and-typecheck, test, integration, e2e, build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Linode (smoke check + auto-rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Guard against a hung health-check loop holding the runner open.
          command_timeout: 15m
          script: |
            set -u
            cd /opt/cogext
            COMPOSE="docker compose -f docker-compose.prod.yml"
            IMAGE="ghcr.io/emdecr/cogext"
            HEALTH_URL="http://localhost:3000/api/health/ready"

            # Poll readiness: 24 tries x 5s = up to 2 min, on top of the
            # container's own healthcheck start_period. Returns 0 once we see
            # HTTP 200, 1 if it never comes.
            wait_ready() {
              for i in $(seq 1 24); do
                code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL" || echo 000)"
                if [ "$code" = "200" ]; then
                  echo "  ready after attempt ${i} (HTTP $code)"
                  return 0
                fi
                echo "  attempt ${i}: HTTP ${code} — retrying in 5s"
                sleep 5
              done
              return 1
            }

            # Capture the currently-running image so we can roll back to it.
            # Empty on the very first deploy (no container yet) — rollback then
            # becomes a no-op and we just report the failure.
            PREV_IMAGE="$($COMPOSE images -q app || true)"
            echo "Previous app image: ${PREV_IMAGE:-<none>}"

            # Pull + deploy the new image.
            $COMPOSE pull app
            $COMPOSE up -d app

            # Smoke check.
            echo "Waiting for $HEALTH_URL ..."
            if wait_ready; then
              docker image prune -f
              echo "Deploy succeeded and is serving."
              exit 0
            fi

            # Failed readiness — roll back if we have something to roll back to.
            echo "::error::New image failed readiness check."
            if [ -z "$PREV_IMAGE" ]; then
              echo "No previous image to roll back to (first deploy?). Leaving new image up for debugging."
              exit 1
            fi

            echo "Rolling back to previous image ${PREV_IMAGE}..."
            docker tag "$PREV_IMAGE" "${IMAGE}:latest"
            $COMPOSE up -d --force-recreate app

            echo "Verifying rollback ..."
            if wait_ready; then
              echo "::error::Deploy failed; rolled back to previous image, which is healthy."
            else
              echo "::error::Deploy failed AND rollback is not healthy — manual intervention required."
            fi
            exit 1

  # =============================================================================
  # JOB 6: Sync ops scripts (lightweight — no image build)
  # =============================================================================
  # backup.sh / restore.sh run ON the server and are NOT baked into the Docker
  # image, so an image rebuild can't deliver them. When they change, we skip the
  # whole build/deploy and just copy them to /opt/cogext/scripts/ over SSH.
  # Runs only on push to main, and only when the `scripts` filter matched.
  #
  # Uses the same DEPLOY_HOST / DEPLOY_SSH_KEY secrets as the deploy job, and the
  # `deploy` user already owns /opt/cogext — no new access required.
  sync-scripts:
    name: Sync ops scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Never ship a syntactically broken script to prod — this is exactly the
      # class of bug (an inline comment breaking line-continuation) that silently
      # disabled backup.sh before. `bash -n` parses without executing.
      - name: Syntax-check scripts
        run: |
          for f in scripts/backup.sh scripts/restore.sh; do
            bash -n "$f"
          done

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Copy scripts to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new"
          rsync -az -e "ssh $SSH_OPTS" \
            scripts/backup.sh scripts/restore.sh \
            "deploy@${DEPLOY_HOST}:/opt/cogext/scripts/"
          ssh $SSH_OPTS "deploy@${DEPLOY_HOST}" 'chmod +x /opt/cogext/scripts/*.sh'
